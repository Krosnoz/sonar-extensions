# On each push and pull request, on Linux, macOS and Windows: checks the types and runs the tests of every extension,
# builds the release's files twice and checks that both builds give the same bytes, lists each archive with the
# system's tar (which reads it), then keeps the files as an artifact. It does not install them in Sonar.
name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.4.4
      - run: bun run setup --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - name: A second build gives the same files
        shell: bash
        run: |
          mv release first-build
          bun run build
          diff -r first-build release
          rm -r first-build
      - name: List each archive
        shell: bash
        run: for archive in release/*.tar.gz; do echo "$archive"; tar -tvzf "$archive"; done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: release/
